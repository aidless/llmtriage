[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmtriage"
version = "0.2.0"
description = "Triage a broken LLM inference deployment in one command: GPU-real usage, fake-lead logs, readiness, runtime budget."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Liu Zewen" }]
keywords = ["llm", "inference", "vllm", "troubleshooting", "sre", "gpu", "observability"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: POSIX :: Linux",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
llmtriage = "llmtriage.cli:main"

[project.urls]
Homepage = "https://github.com/aidless/llmtriage"

[tool.setuptools.packages.find]
include = ["llmtriage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
